<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wacdo - Numéro de chevalet</title>
  <meta name="description" content="Indiquez le numéro de votre chevalet pour être servi à table." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="fin-commande">
    <div class="fin-commande__carte">
      <img src="images/images/illustration-sur-place.png" alt="" style="height:80px;margin:0 auto 1rem auto;" />
      <h1>Pour être servis à table,</h1>
      <p>Récupérez un chevalet et indiquez ici le numéro inscrit dessus.</p>

      <form id="form-chevalet">
        <div class="chevalet-chiffres">
          <label class="visually-hidden" for="chiffre-1">Premier chiffre</label>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="chiffre-1" required />
          <label class="visually-hidden" for="chiffre-2">Deuxième chiffre</label>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="chiffre-2" required />
          <label class="visually-hidden" for="chiffre-3">Troisième chiffre</label>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="chiffre-3" required />
        </div>
        <button type="submit" class="btn btn-jaune" id="btn-enregistrer">Enregistrer le numéro</button>
      </form>
    </div>
  </main>

  <script src="js/panier.js"></script>
  <script src="js/fin-commande.js"></script>
</body>
</html>
