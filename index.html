<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wacdo - Bienvenue</title>
    <meta name="description"
        content="Bienvenue chez WacDo, Choisissez votre mode de consommation pour commencer votre commande." />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="accueil">
        <div class="accueil__carte">
            <h1>Bonjour,</h1>
            <p>Souhaitez-vous consommer votre menu sur place ou préférez-vous l'emporter ?</p>
            <div class="accueil__choix" role="group" aria-label="Mode de consommation">
                <button type="button" class="choix-btn" id="btn-sur-place">
                    <img src="images/images/illustration-sur-place.png" alt="" />
                    Sur Place
                </button>
                <button type="button" class="choix-btn" id="btn-a-emporter">
                    <img src="images/images/illustration-a-emporter.png" alt="" />
                    A Emporter
                </button>
            </div>
        </div>
    </main>

    <script src="js/panier.js"></script>
    <script src="js/accueil.js"></script>
</body>
</html>
